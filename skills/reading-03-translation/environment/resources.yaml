schema: skill-resources/v1
name: bilingual-translation-guard
version: 1.0.0
description: >
  Paragraph-aligned scientific translation with a locked glossary and
  byte-level guards on numbers, citations, formulas, negation and hedging.
  Reads /input/case.json, writes /app/output/result.json plus plan.json,
  translation.md and checks.json.

entry: scripts/run_case.py
entry_args: []

runtime:
  python: "3.11"
  pip: []
  system: []
  notes: >
    Standard library only. PDF text is read with pymupdf when present, then
    pdftotext, then a minimal stream extractor (marked partial). No network.

resources:
  - path: scripts/run_case.py
    role: entry
  - path: scripts/translate_guard.py
    role: engine
  - path: scripts/skillkit.py
    role: library
  - path: references/glossary-policy.md
    role: docs
  - path: references/check-rules.md
    role: docs
  - path: references/segment-schema.md
    role: docs
  - path: examples/README.md
    role: docs

limits:
  text_files: 50
  bytes_per_file: 512000
  bytes_total: 2097152
  symlinks: false
